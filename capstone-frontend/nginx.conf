server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ทุก path ให้ลองหาไฟล์ก่อน ถ้าไม่มี → เสิร์ฟ index.html
    location / {
        try_files $uri /index.html;
    }

    # asset static ถ้าไม่มีจริง ๆ ค่อย 404
    location /assets/ {
        try_files $uri =404;
    }
}
