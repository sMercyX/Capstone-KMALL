_format_version: "3.0"
_transform: true

services:
  - name: frontend
    url: http://frontend:80
    routes:
      - name: frontend-route
        paths:
          - /
          - ~^/capstone25/cp25ssa2(?=/|$)
        strip_path: false
        preserve_host: true

  - name: oauth2-public
    url: http://oauth2-proxy:4180
    routes:
      - name: oauth2-route
        paths:
          - /oauth2
          - /oauth2/
          - /oauth2/*
        strip_path: false
        preserve_host: false

  - name: api-service
    url: http://oauth2-proxy:4180
    routes:
      - name: api-route
        paths:
          - /capstone25/cp25ssa2/api
        strip_path: true
        preserve_host: false

    plugins:
      - name: request-transformer
        config:
          add:
            headers:
              - "X-Auth-Request-Email:{{X-Auth-Request-Email}}"
              - "X-Auth-Request-Oid:{{X-Auth-Request-Oid}}"
              - "X-Auth-Request-Name:{{X-Auth-Request-Name}}"
              - "Authorization:{{Authorization}}"

      - name: cors
        config:
          origins:
            - https://bscit.sit.kmutt.ac.th
          methods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
          credentials: true
          headers:
            - Authorization
            - Content-Type
            - Cookie
            - X-Requested-With
            - X-Auth-Request-Email
            - X-Auth-Request-Name
            - X-Auth-Request-Oid
          exposed_headers:
            - Set-Cookie
            - Authorization
          max_age: 3600
