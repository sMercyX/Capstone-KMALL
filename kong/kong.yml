_format_version: "3.0"
_transform: true

services:
  # ===== FRONTEND (React build บน Nginx) =====
  - name: frontend
    url: http://frontend:80         
    routes:
      - name: frontend-route
        paths:
          - /
          - /capstone25/cp25ssa2
          - /capstone25/cp25ssa2/ 
        strip_path: false
        preserve_host: true

  # ===== OAUTH2-PROXY PUBLIC ENDPOINTS (/oauth2/*) =====
  - name: oauth2-public
    url: http://oauth2-proxy:4180
    routes:
      - name: oauth2-route
        paths:
          - /oauth2
          - /oauth2/
          - /oauth2/*
        strip_path: false
        preserve_host: true


  # ===== API THROUGH OAUTH2-PROXY (/api/*) =====
  - name: api-service
    url: http://oauth2-proxy:4180
    routes:
      - name: api-route
        paths:
          - /capstone25/cp25ssa2/api
        strip_path: false
        preserve_host: true
    plugins:
      - name: cors
        config:
          origins:
            - https://bscit.sit.kmutt.ac.th
          methods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
          credentials: true
          headers:
            - Authorization
            - Content-Type
            - Cookie
            - X-Requested-With
          exposed_headers:
            - Set-Cookie
            - Authorization
          max_age: 3600
