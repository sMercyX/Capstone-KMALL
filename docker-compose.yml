services:
  frontend:
    build: ./capstone-frontend # 🧱 Dockerfile อยู่ใน capstone-frontend
    expose:
      - "5173"
    volumes:
      - ./capstone-frontend:/app # sync code ระหว่าง host <-> container
      - /app/node_modules # ป้องกัน node_modules ทับกัน
    env_file:
      - ./capstone-frontend/.env
    restart: unless-stopped

  backend:
    build: ./capstone-backend
    env_file:
      - ./capstone-backend/.env
    expose:
      - "8080"
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres/25
      POSTGRES_DB: kmall_db
    expose:
      - "5432"
    volumes:
      - ./capstone-database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  kong-database:
    image: postgres:13
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kongpass
    volumes:
      - kong_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  kong-migrations:
    image: kong/kong-gateway:latest
    depends_on:
      - kong-database
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpass
    command: kong migrations bootstrap

  kong:
    image: kong/kong-gateway:latest
    depends_on:
      - kong-database
      - kong-migrations
      - frontend
      - backend
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpass
      KONG_PROXY_LISTEN: "0.0.0.0:80"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"

      # ✅ สำหรับ reverse proxy ของคณะ
      # KONG_TRUSTED_IPS: "0.0.0.0/0"
      # KONG_REAL_IP_HEADER: "X-Forwarded-For"
      # KONG_HEADERS_UPSTREAM: "host"
    ports:
      - "80:80"      # Reverse proxy (public)
      - "8001:8001"  # Admin API (private)
    restart: unless-stopped

  # kong:
  #   image: kong/kong-gateway:latest
  #   environment:
  #     KONG_DATABASE: "off"                  # ปิดการใช้ Postgres DB
  #     KONG_DECLARATIVE_CONFIG: /kong/kong.yml  # ชี้ไปที่ไฟล์ config
  #     KONG_PROXY_LISTEN: "0.0.0.0:8000"
  #     KONG_ADMIN_LISTEN: "0.0.0.0:8001"
  #   volumes:
  #     - ./kong/kong.yml:/kong/kong.yml
  #   ports:
  #     - "80:80"      # public
  #     - "8001:8001"  # admin api
  #   restart: unless-stopped


volumes:
  kong_db_data: